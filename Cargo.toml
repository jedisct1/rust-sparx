[package]
authors = ["Frank Denis <github@pureftpd.org>"]
keywords = ["sparx", "cipher", "encryption", "arx", "no-std"]
license = "ISC"
name = "sparx"
description = "SPARX lightweight block ciphers and CTR stream encryption in pure Rust, with no_std support"
repository = "https://github.com/jedisct1/rust-sparx"
version = "0.1.2"
categories = ["algorithms", "cryptography"]
edition = "2018"

[dependencies]
byteorder = { version = "1", default-features = false }

[profile.release]
lto = true
panic = "abort"
opt-level = 3
